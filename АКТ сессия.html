<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ташенов университеті - Сессияға дайындық</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Загрузка экранының стилі */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader-screen h2 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        #loader-screen p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin: 0;
        }

        /* Негізгі тест карточкасы */
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-in-out;
            display: none; /* Басында жасырын тұрады */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 26px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 14px 20px;
            text-align: left;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eef2ff;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
            animation: pulse 0.4s;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b;
            animation: shake 0.4s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .next-btn {
            display: none;
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        #result-container {
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        #result-container h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        #result-container p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #475569;
        }

        .restart-btn {
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

        currentIdx = 0;
        score = 0;
        document.getElementById("result-container").style.display = "none";
        document.getElementById("quiz-box").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizData[currentIdx];
        document.getElementById("questionContainer").innerText = `${currentIdx + 1}. ${q.question}`;
        
        const progressPercent = ((currentIdx) / quizData.length) * 100;
        document.getElementById("progressFill").style.width = `${progressPercent}%`;

        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt, q.correct);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("nextBtn").style.display = "none";
    }

    function selectOption(selectedBtn, selectedAnswer, correctAnswer) {
        const allButtons = document.querySelectorAll(".option-btn");
        
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedAnswer === correctAnswer) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("incorrect");
            allButtons.forEach(btn => {
                if (btn.innerText === correctAnswer) {
                    btn.classList.add("correct");
                }
            });
        }

        document.getElementById("nextBtn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-box").style.display = "none";
        const resultContainer = document.getElementById("result-container");
        resultContainer.style.display = "block";

        const percent = Math.round((score / quizData.length) * 100);
        let message = "";

        if (percent >= 85) {
            message = "Керемет нәтиже! Пәнді өте жақсы меңгеріпсіз! 🏆";
        } else if (percent >= 50) {
            message = "Жаман емес, бірақ тағы да дайындық жасауға болады. 👍";
        } else {
            message = "Қайталап шығуға кеңес беріледі. 📚";
        }

        document.getElementById("scoreText").innerHTML = `Барлық сұрақ: <b>${quizData.length}</b><br>Дұрыс жауаптар саны: <b>${score}</b><br>Көрсеткіш: <b>${percent}%</b><br><br>${message}`;
    }

    function restartQuiz() {
        initQuiz();
    }
</script>
